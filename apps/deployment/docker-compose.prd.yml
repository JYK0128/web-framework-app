name: service-factory-apps-prd

services:
  admin-api:
    image: ${ADMIN_API_IMAGE:?Set ADMIN_API_IMAGE to an immutable image reference}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${ADMIN_API_PORT:?Set ADMIN_API_PORT}
      DOTENV_PRIVATE_KEY_PRD: ${ADMIN_API_DOTENV_PRIVATE_KEY_PRD:?Set the admin-api dotenvx key}
      SERVICE_API_URL: http://service-api:${SERVICE_API_PORT:?Set SERVICE_API_PORT}
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:?Set ADMIN_WEB_URL}
    volumes:
      - admin-api-uploads:/app/data/uploads
    networks:
      - runtime
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  admin-web:
    image: ${ADMIN_WEB_IMAGE:?Set ADMIN_WEB_IMAGE to an immutable image reference}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${ADMIN_WEB_PORT:?Set ADMIN_WEB_PORT}
      DOTENV_PRIVATE_KEY_PRD: ${ADMIN_WEB_DOTENV_PRIVATE_KEY_PRD:?Set the admin-web dotenvx key}
      APP_BASE_URL: http://admin-api:${ADMIN_API_PORT:?Set ADMIN_API_PORT}
    networks:
      - runtime
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  service-api:
    image: ${SERVICE_API_IMAGE:?Set SERVICE_API_IMAGE to an immutable image reference}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${SERVICE_API_PORT:?Set SERVICE_API_PORT}
      DOTENV_PRIVATE_KEY_PRD: ${SERVICE_API_DOTENV_PRIVATE_KEY_PRD:?Set the service-api dotenvx key}
      ADMIN_API_URL: http://admin-api:${ADMIN_API_PORT:?Set ADMIN_API_PORT}
    volumes:
      - service-api-uploads:/app/data/uploads
    networks:
      - runtime
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  service-web:
    image: ${SERVICE_WEB_IMAGE:?Set SERVICE_WEB_IMAGE to an immutable image reference}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${SERVICE_WEB_PORT:?Set SERVICE_WEB_PORT}
      DOTENV_PRIVATE_KEY_PRD: ${SERVICE_WEB_DOTENV_PRIVATE_KEY_PRD:?Set the service-web dotenvx key}
      APP_BASE_URL: http://service-api:${SERVICE_API_PORT:?Set SERVICE_API_PORT}
    networks:
      - runtime
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

networks:
  runtime:
    name: ${APPS_RUNTIME_NETWORK:?Set APPS_RUNTIME_NETWORK to the verified shared runtime network}
    external: true

volumes:
  admin-api-uploads:
    name: ${ADMIN_API_UPLOADS_VOLUME:?Set ADMIN_API_UPLOADS_VOLUME after confirming the data migration}
    external: true
  service-api-uploads:
    name: ${SERVICE_API_UPLOADS_VOLUME:?Set SERVICE_API_UPLOADS_VOLUME after confirming the data migration}
    external: true
