name: service-factory-apps-e2e

x-app-image: &app-image
  image: service-factory-apps-e2e
  pull_policy: never

services:
  e2e-postgres:
    image: postgres:17-alpine
    container_name: service-factory-apps-e2e-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:?E2E_POSTGRES_PASSWORD is required}
      POSTGRES_DB: admin_db
    volumes:
      - ./infra/postgres/manifest.sql:/docker-entrypoint-initdb.d/10-service-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admin_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  e2e-redis:
    image: redis:7-alpine

  e2e-loki:
    image: grafana/loki:3.0.0

  e2e-admin-api:
    <<: *app-image
    build:
      context: ../..
      dockerfile: apps/deployment/Dockerfile.dev
    working_dir: /app/apps/admin-api
    command: pnpm dev
    ports:
      - "127.0.0.1:14100:14000"
    environment:
      NODE_ENV: development
      PORT: 14000
      APP_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      DATABASE_URL: postgres://postgres:${E2E_POSTGRES_PASSWORD:?E2E_POSTGRES_PASSWORD is required}@e2e-postgres:5432/admin_db
      REDIS_URL: redis://e2e-redis:6379
      LOKI_URL: http://e2e-loki:3100
      PORTONE_API_SECRET: e2e-only-placeholder
      SERVICE_API_URL: http://e2e-service-api:4000
      APP_BASE_URL: http://localhost:13100
    depends_on:
      e2e-postgres:
        condition: service_healthy
      e2e-redis:
        condition: service_started
      e2e-loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "const s = require('node:net').createConnection(14000, '127.0.0.1'); s.on('connect', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1));"]
      interval: 2s
      timeout: 3s
      retries: 60

  e2e-service-api:
    <<: *app-image
    working_dir: /app/apps/service-api
    command: pnpm dev
    ports:
      - "127.0.0.1:4100:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      APP_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      DATABASE_URL: postgres://postgres:${E2E_POSTGRES_PASSWORD:?E2E_POSTGRES_PASSWORD is required}@e2e-postgres:5432/service_db
      REDIS_URL: redis://e2e-redis:6379
      LOKI_URL: http://e2e-loki:3100
      ADMIN_API_URL: http://e2e-admin-api:14000
      APP_BASE_URL: http://localhost:3100
    depends_on:
      e2e-postgres:
        condition: service_healthy
      e2e-redis:
        condition: service_started
      e2e-loki:
        condition: service_started
      e2e-admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const s = require('node:net').createConnection(4000, '127.0.0.1'); s.on('connect', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1));"]
      interval: 2s
      timeout: 3s
      retries: 60

  e2e-admin-web:
    <<: *app-image
    working_dir: /app/apps/admin-web
    env_file:
      - ../admin-web/.env
    command: pnpm dev
    ports:
      - "127.0.0.1:13100:13100"
    environment:
      NODE_ENV: development
      PORT: 13100
      APP_NAME: admin
      API_BASE_URL: http://e2e-admin-api:14000
      APP_BASE_URL: http://localhost:13100
      API_SPEC_URL: http://e2e-admin-api:14000/api/docs-json
    depends_on:
      e2e-admin-api:
        condition: service_healthy

  e2e-service-web:
    <<: *app-image
    working_dir: /app/apps/service-web
    env_file:
      - ../service-web/.env
    command: pnpm dev
    ports:
      - "127.0.0.1:3300:3300"
    environment:
      NODE_ENV: development
      PORT: 3300
      APP_NAME: service
      API_BASE_URL: http://e2e-service-api:4000
      APP_BASE_URL: http://localhost:3300
      VITE_ADMIN_WEB_URL: http://localhost:13100
      API_SPEC_URL: http://e2e-service-api:4000/api/docs-json
    depends_on:
      e2e-service-api:
        condition: service_healthy

