services:
  postgres:
    image: postgres:17-alpine
    container_name: service-factory-apps-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admin_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./manifest.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admin_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
