sources:
  # 1. 도커 컨테이너 표준 출력(stdout/stderr) 수집
  docker_logs_dev:
    type: docker_logs
    include_labels:
      - com.docker.compose.project=service-factory-apps-dev

  docker_logs_prd:
    type: docker_logs
    include_labels:
      - com.docker.compose.project=service-factory-apps-prd

  # 2. HTTP 수신 소스 (필요 시 직접 POST 지원)
  http_logs:
    type: http_server
    address: 0.0.0.0:8686
    encoding: json

transforms:
  process_docker_logs:
    type: remap
    inputs:
      - docker_logs_dev
      - docker_logs_prd
    source: |
      .receivedAt = now()
      raw_str = strip_whitespace(string!(.message))
      cleaned = replace(raw_str, r'\x1b\[[0-9;]*m', "")

      parsed, err = parse_json(cleaned)
      if err == null && is_object(parsed) {
        ., _ = merge(., parsed)
        if exists(.request) { .requestBody = .request }
        if exists(.response) { .responseBody = .response }
      }
      if exists(.timestamp) {
        .createdAt = .timestamp
      } else {
        .createdAt = now()
      }
      if !exists(.id) {
        .id = uuid_v4()
      }
      if !exists(.level) {
        .level = "INFO"
      }
      if !exists(.tag) {
        .tag = "APP"
      }
      if exists(.label."com.docker.compose.service") {
        .service = .label."com.docker.compose.service"
      } else {
        .service = "unknown"
      }
      if !exists(.message) || is_null(.message) {
        .message = raw_str
      }

  process_http_logs:
    type: remap
    inputs:
      - http_logs
    source: |
      .receivedAt = now()
      if !exists(.id) {
        .id = uuid_v4()
      }
      if exists(.timestamp) {
        .createdAt = .timestamp
      } else {
        .createdAt = now()
      }
      if !exists(.level) {
        .level = "INFO"
      }
      if !exists(.tag) {
        .tag = "APP"
      }
      if !exists(.service) {
        .service = "http"
      }

sinks:
  to_loki:
    type: loki
    inputs:
      - process_docker_logs
      - process_http_logs
    endpoint: http://loki:3100
    labels:
      service: "{{ service }}"
      env: "${APP_ENV}"
      tag: "{{ tag }}"
      level: "{{ level }}"
    encoding:
      codec: json
