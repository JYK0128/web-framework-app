services:
  loki:
    image: grafana/loki:3.0.0
    container_name: service-factory-apps-loki
    restart: unless-stopped
    ports:
      - "3101:3100"
    volumes:
      - ./manifest.yml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/loki.yaml"]

volumes:
  loki-data:
