services:
  # 1. 인메모리 세션/보안 저장소
  redis:
    image: redis:7-alpine
    container_name: dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data

  # 2. 메인 관계형 데이터베이스 (PostgreSQL 17)
  postgres:
    image: postgres:17-alpine
    container_name: dev-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth_db
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 3. 로그 저장소 (Grafana Loki)
  loki:
    image: grafana/loki:3.0.0
    container_name: dev-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]

  # 4. 로깅 사이드카 (Vector - stdio/docker_logs 기반)
  log-sidecar:
    image: timberio/vector:0.43.0-alpine
    container_name: dev-log-sidecar
    restart: unless-stopped
    ports:
      - "8686:8686"
    volumes:
      - ./docker/vector/sidecar.yaml:/etc/vector/vector.yaml:ro
      # 컨테이너의 표준 출력(stdio)을 실시간으로 읽기 위한 도커 소켓 마운트
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    depends_on:
      - loki

  # 5. NestJS 백엔드 서버 (Hot-reload)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: web-framework-app-dev:latest
    container_name: dev-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./template/nest-starter-kit/.env.development
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/auth_db
      - REDIS_URL=redis://redis:6379
      - VECTOR_URL=http://log-sidecar:8686
      - LOKI_URL=http://loki:3100
    volumes:
      # 호스트 소스 코드 실시간 반영
      - .:/app
      # 네이티브 의존성 충돌 방지용 컨테이너 볼륨 격리 (명명된 볼륨)
      - app-root-node-modules:/app/node_modules
      - app-nest-node-modules:/app/template/nest-starter-kit/node_modules
      - app-react-node-modules:/app/template/react-starter-kit/node_modules
      - app-npm-node-modules:/app/template/npm-starter-kit/node_modules
      - app-shared-node-modules:/app/packages/shared/node_modules
      - app-config-node-modules:/app/packages/config/node_modules
    working_dir: /app/template/nest-starter-kit
    command: pnpm dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      log-sidecar:
        condition: service_started

  # 6. React + Nitro BFF 프론트엔드 서버 (Vite HMR)
  frontend:
    image: web-framework-app-dev:latest
    container_name: dev-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./template/react-starter-kit/.env.development
    environment:
      - BACKEND_URL=http://backend:4000
      - VECTOR_URL=http://log-sidecar:8686
    volumes:
      - .:/app
      - app-root-node-modules:/app/node_modules
      - app-nest-node-modules:/app/template/nest-starter-kit/node_modules
      - app-react-node-modules:/app/template/react-starter-kit/node_modules
      - app-npm-node-modules:/app/template/npm-starter-kit/node_modules
      - app-shared-node-modules:/app/packages/shared/node_modules
      - app-config-node-modules:/app/packages/config/node_modules
    working_dir: /app/template/react-starter-kit
    command: pnpm dev
    depends_on:
      - backend

volumes:
  redis-dev-data:
  postgres-dev-data:
  loki-data:
  app-root-node-modules:
  app-nest-node-modules:
  app-react-node-modules:
  app-npm-node-modules:
  app-shared-node-modules:
  app-config-node-modules:
