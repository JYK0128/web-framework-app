name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository }}/app

jobs:
  quality-check:
    name: 🧪 Quality Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Lint
        run: pnpm lint

  build-and-push:
    name: 🐳 Build & Push Unified App
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Unified App Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prd
          push: true
          tags: ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  remote-deploy:
    name: 🚀 Remote Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: APP_IMAGE,REGISTRY,GITHUB_ACTOR
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.SERVER_DEPLOY_PATH || '/home/ubuntu/web-framework-app' }}"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "📂 Repository not found at $DEPLOY_PATH, auto-cloning deploy/docker branch..."
              mkdir -p "$DEPLOY_PATH"
              git clone -b deploy/docker https://github.com/${{ github.repository }}.git "$DEPLOY_PATH"
            fi

            echo "📂 Navigating to deploy path: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo "📥 Syncing latest deploy configuration from deploy/docker..."
            git fetch origin deploy/docker
            git reset --hard origin/deploy/docker

            echo "🔑 Logging in to GHCR on server..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "📥 Pulling latest app image..."
            export APP_IMAGE="${{ env.APP_IMAGE }}:latest"
            docker compose --env-file .env.prd.docker -f docker-compose.yml pull app

            echo "🔄 Restarting production containers..."
            docker compose --env-file .env.prd.docker -f docker-compose.yml up -d --remove-orphans

            echo "🧹 Pruning old dangling images..."
            docker image prune -af --filter "until=24h"

            echo "✅ Deployment completed successfully!"
