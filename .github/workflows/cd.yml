name: CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  quality-check:
    name: Quality Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate production deployment settings
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
          APPS_RUNTIME_NETWORK: ${{ vars.APPS_RUNTIME_NETWORK }}
          ADMIN_API_PORT: ${{ vars.ADMIN_API_PORT }}
          ADMIN_WEB_PORT: ${{ vars.ADMIN_WEB_PORT }}
          SERVICE_API_PORT: ${{ vars.SERVICE_API_PORT }}
          SERVICE_WEB_PORT: ${{ vars.SERVICE_WEB_PORT }}
          ADMIN_WEB_URL: ${{ vars.ADMIN_WEB_URL }}
          SERVICE_WEB_URL: ${{ vars.SERVICE_WEB_URL }}
          ADMIN_API_UPLOADS_VOLUME: ${{ vars.ADMIN_API_UPLOADS_VOLUME }}
          SERVICE_API_UPLOADS_VOLUME: ${{ vars.SERVICE_API_UPLOADS_VOLUME }}
          ADMIN_API_DOTENV_PRIVATE_KEY_PRD: ${{ secrets.ADMIN_API_DOTENV_PRIVATE_KEY_PRD }}
          ADMIN_WEB_DOTENV_PRIVATE_KEY_PRD: ${{ secrets.ADMIN_WEB_DOTENV_PRIVATE_KEY_PRD }}
          SERVICE_API_DOTENV_PRIVATE_KEY_PRD: ${{ secrets.SERVICE_API_DOTENV_PRIVATE_KEY_PRD }}
          SERVICE_WEB_DOTENV_PRIVATE_KEY_PRD: ${{ secrets.SERVICE_WEB_DOTENV_PRIVATE_KEY_PRD }}
          VITE_PORTONE_STORE_ID: ${{ vars.VITE_PORTONE_STORE_ID }}
          VITE_PORTONE_IDENTITY_VERIFICATION_CHANNEL_KEY: ${{ vars.VITE_PORTONE_IDENTITY_VERIFICATION_CHANNEL_KEY }}
        run: |
          required=(SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_DEPLOY_PATH
            APPS_RUNTIME_NETWORK ADMIN_API_PORT ADMIN_WEB_PORT SERVICE_API_PORT SERVICE_WEB_PORT
            ADMIN_WEB_URL SERVICE_WEB_URL ADMIN_API_UPLOADS_VOLUME SERVICE_API_UPLOADS_VOLUME
            ADMIN_API_DOTENV_PRIVATE_KEY_PRD ADMIN_WEB_DOTENV_PRIVATE_KEY_PRD
            SERVICE_API_DOTENV_PRIVATE_KEY_PRD SERVICE_WEB_DOTENV_PRIVATE_KEY_PRD
            VITE_PORTONE_STORE_ID VITE_PORTONE_IDENTITY_VERIFICATION_CHANNEL_KEY)
          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing production setting: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Lint
        run: pnpm lint

  build-and-push:
    name: Build and Push ${{ matrix.app }}
    needs: quality-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - admin-api
          - admin-web
          - service-api
          - service-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image reference
        id: image
        env:
          APP_NAME: ${{ matrix.app }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${APP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate encrypted runtime config
        env:
          APP_NAME: ${{ matrix.app }}
        run: |
          env_file="apps/deployment/env/${APP_NAME}/.env.prd"
          if [ ! -s "$env_file" ]; then
            echo "Required encrypted runtime file is missing: $env_file" >&2
            exit 1
          fi
          if ! grep -q '^DOTENV_PUBLIC_KEY_PRD=' "$env_file"; then
            echo "Runtime config is missing the dotenvx public key: $env_file" >&2
            exit 1
          fi
          awk -F= '
            /^[[:space:]]*($|#)/ { next }
            $1 == "DOTENV_PUBLIC_KEY_PRD" { next }
            {
              value = substr($0, index($0, "=") + 1)
              sub(/^"/, "", value)
              if (value !~ /^encrypted:/) {
                print "Plaintext or unsupported value found in encrypted runtime config: " FILENAME > "/dev/stderr"
                invalid = 1
              }
              checked++
            }
            END {
              if (checked == 0 || invalid) exit 1
            }
          ' "$env_file"

      - name: Build and push immutable app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/deployment/Dockerfile.prd
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
            APP_REVISION=${{ github.sha }}
            DOTENV_PRD_REVISION=${{ hashFiles(format('apps/deployment/env/{0}/.env.prd', matrix.app)) }}
            VITE_PORTONE_STORE_ID=${{ vars.VITE_PORTONE_STORE_ID }}
            VITE_PORTONE_IDENTITY_VERIFICATION_CHANNEL_KEY=${{ vars.VITE_PORTONE_IDENTITY_VERIFICATION_CHANNEL_KEY }}
          secret-files: |
            DOTENV_PRD=apps/deployment/env/${{ matrix.app }}/.env.prd
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Record image reference
        env:
          APP_NAME: ${{ matrix.app }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          echo "- \`${APP_NAME}\`: \`${IMAGE_NAME}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy all apps
    needs: [quality-check, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Compose stack over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REF: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
          APPS_RUNTIME_NETWORK: ${{ vars.APPS_RUNTIME_NETWORK }}
          ADMIN_API_PORT: ${{ vars.ADMIN_API_PORT }}
          ADMIN_WEB_PORT: ${{ vars.ADMIN_WEB_PORT }}
          SERVICE_API_PORT: ${{ vars.SERVICE_API_PORT }}
          SERVICE_WEB_PORT: ${{ vars.SERVICE_WEB_PORT }}
          ADMIN_WEB_URL: ${{ vars.ADMIN_WEB_URL }}
          SERVICE_WEB_URL: ${{ vars.SERVICE_WEB_URL }}
          ADMIN_API_UPLOADS_VOLUME: ${{ vars.ADMIN_API_UPLOADS_VOLUME }}
          SERVICE_API_UPLOADS_VOLUME: ${{ vars.SERVICE_API_UPLOADS_VOLUME }}
          ADMIN_API_DOTENV_PRIVATE_KEY_PRD: ${{ secrets.ADMIN_API_DOTENV_PRIVATE_KEY_PRD }}
          ADMIN_WEB_DOTENV_PRIVATE_KEY_PRD: ${{ secrets.ADMIN_WEB_DOTENV_PRIVATE_KEY_PRD }}
          SERVICE_API_DOTENV_PRIVATE_KEY_PRD: ${{ secrets.SERVICE_API_DOTENV_PRIVATE_KEY_PRD }}
          SERVICE_WEB_DOTENV_PRIVATE_KEY_PRD: ${{ secrets.SERVICE_WEB_DOTENV_PRIVATE_KEY_PRD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 30m
          envs: DEPLOY_REF,DEPLOY_SHA,GITHUB_REPOSITORY,GITHUB_ACTOR,GHCR_TOKEN,SERVER_DEPLOY_PATH,APPS_RUNTIME_NETWORK,ADMIN_API_PORT,ADMIN_WEB_PORT,SERVICE_API_PORT,SERVICE_WEB_PORT,ADMIN_WEB_URL,SERVICE_WEB_URL,ADMIN_API_UPLOADS_VOLUME,SERVICE_API_UPLOADS_VOLUME,ADMIN_API_DOTENV_PRIVATE_KEY_PRD,ADMIN_WEB_DOTENV_PRIVATE_KEY_PRD,SERVICE_API_DOTENV_PRIVATE_KEY_PRD,SERVICE_WEB_DOTENV_PRIVATE_KEY_PRD
          script: |
            set -eu

            if [ -z "$SERVER_DEPLOY_PATH" ] || [ ! -d "$SERVER_DEPLOY_PATH/.git" ]; then
              echo "SERVER_DEPLOY_PATH must point to an existing checkout of this repository." >&2
              exit 1
            fi

            cd "$SERVER_DEPLOY_PATH"

            # Old infrastructure still binds files from docker/ in this checkout.
            # Refuse to delete those files until its mounts have been relocated.
            for container in postgres redis loki vector; do
              if docker inspect "$container" >/dev/null 2>&1; then
                sources=$(docker inspect "$container" --format '{{range .Mounts}}{{if eq .Type "bind"}}{{println .Source}}{{end}}{{end}}')
                case "$sources" in
                  *"$SERVER_DEPLOY_PATH/docker/"*)
                    echo "Relocate legacy infrastructure bind mounts before deploying: $container" >&2
                    exit 1
                    ;;
                esac
              fi
            done

            git fetch origin "$DEPLOY_REF"
            git reset --hard "$DEPLOY_SHA"

            export APP_REVISION="$DEPLOY_SHA"
            REPOSITORY_LOWER=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
            export ADMIN_API_IMAGE="ghcr.io/${REPOSITORY_LOWER}/admin-api:${DEPLOY_SHA}"
            export ADMIN_WEB_IMAGE="ghcr.io/${REPOSITORY_LOWER}/admin-web:${DEPLOY_SHA}"
            export SERVICE_API_IMAGE="ghcr.io/${REPOSITORY_LOWER}/service-api:${DEPLOY_SHA}"
            export SERVICE_WEB_IMAGE="ghcr.io/${REPOSITORY_LOWER}/service-web:${DEPLOY_SHA}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose -f apps/deployment/docker-compose.prd.yml config --quiet
            docker network inspect "$APPS_RUNTIME_NETWORK" >/dev/null
            docker volume inspect "$ADMIN_API_UPLOADS_VOLUME" "$SERVICE_API_UPLOADS_VOLUME" >/dev/null
            docker compose -f apps/deployment/docker-compose.prd.yml pull
            for api in admin-api service-api; do
              docker compose -f apps/deployment/docker-compose.prd.yml run --rm --no-deps --entrypoint node "$api" -e "require('node:fs').accessSync('/app/data/uploads', require('node:fs').constants.W_OK)"
            done
            docker compose -f apps/deployment/docker-compose.prd.yml up -d --remove-orphans --wait --wait-timeout 600
            docker compose -f apps/deployment/docker-compose.prd.yml ps
