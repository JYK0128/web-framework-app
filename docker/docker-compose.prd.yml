name: web-framework-app-prd

services:
  postgres:
    image: postgres:17-alpine
    container_name: prd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: template_db
    volumes:
      - prd-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d template_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prd-redis
    restart: unless-stopped
    volumes:
      - prd-redis-data:/data

  log-storage:
    image: grafana/loki:3.0.0
    container_name: prd-log-storage
    restart: unless-stopped
    volumes:
      - ./log-storage/loki.yaml:/etc/loki/loki.yaml:ro
      - prd-log-storage-data:/loki
    command: ["-config.file=/etc/loki/loki.yaml"]

  log-collector:
    image: timberio/vector:0.43.0-alpine
    container_name: prd-log-collector
    restart: unless-stopped
    volumes:
      - ./log-collector/vector.prd.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    depends_on:
      - log-storage

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prd.backend
    image: web-framework-app-backend:prd
    container_name: prd-backend
    restart: unless-stopped
    env_file:
      - ../template/nest-starter-kit/.env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/template_db
      REDIS_URL: redis://redis:6379
      LOKI_URL: http://log-storage:3100
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:13000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      log-storage:
        condition: service_started
      log-collector:
        condition: service_started
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prd.frontend
      args:
        BACKEND_URL: http://backend:4000
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-G-XXXXXXXXXX}
    image: web-framework-app-frontend:prd
    container_name: prd-frontend
    restart: unless-stopped
    env_file:
      - ../template/react-starter-kit/.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_started
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: prd-cloudflared
    restart: unless-stopped
    profiles:
      - cloudflare
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      frontend:
        condition: service_started

volumes:
  prd-postgres-data:
  prd-redis-data:
  prd-log-storage-data:
