services:
  vector:
    image: timberio/vector:0.43.0-alpine
    container_name: vector
    restart: unless-stopped
    ports:
      - "8686:8686"
    environment:
      - APP_ENV=dev
    volumes:
      - ./manifest.yml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    depends_on:
      - loki
